schema: spec-driven

context: |
  Tech stack: NestJS (backend) + Next.js App Router (frontend) + PostgreSQL + Prisma + pnpm monorepo
  Architecture: Modular NestJS (payments, patients, doctors, receipts, stats), Feature-Sliced Next.js
  Testing: Jest backend; frontend Jest 30/jsdom/RTL/MSW, 19 business component suites + two harness suites, 179 tests; no browser E2E
  Style: ESLint + Prettier, TypeScript strict, Clean Code / SOLID conventions
  Docker: compose dev locally; production images on Railway; all runtime commands inside containers

strict_tdd: true

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
    - Must specify Gentle AI chained PR strategy when >400 lines
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include schema changes for Prisma
    - Document architecture decisions with rationale
    - Specify DTO contracts explicitly
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep PR slices under 400 changed lines
    - Use Stacked PRs or Feature Branch Chain for >400 line changes
  apply:
    - Follow existing code patterns and conventions from AGENTS.md
    - Load relevant coding skills for the project stack (@nestjs-best-practices, @nextjs-best-practices)
    - All TypeScript checks run inside Docker containers only
  verify:
    - Run pnpm run typecheck && pnpm run lint in affected workspaces
    - Compare implementation against every spec scenario
    - Manual regression testing for payment flows
  archive:
    - Warn before merging destructive deltas (large removals)
    - Update .atl/ artifacts if they diverge from openspec/

testing:
  strict_tdd_mode: true
  runner:
    command: "jest"
    framework: "jest"
    workspaces:
      - "apps/api"
      - "apps/web"
  layers:
    unit:
      available: true
      tool: "jest (backend and frontend)"
    integration:
      available: true
      tool: "jest + supertest (backend); Jest/jsdom + RTL + MSW (frontend harness verified)"
    e2e:
      available: true
      tool: "jest e2e (backend)"
  frontend:
    workspace: "apps/web"
    command: "docker compose -f docker-compose.dev.yml exec -T web pnpm run test --runInBand"
    component_integration_available: true
    business_view_suites_available: true
    business_view_suites_count: 19
    business_view_tests_count: 174
    business_view_scope: "E047: V03=10,V01=14,V04=25,V05=26,V06=22,V07=23,V08=10,V09=28,V10=16;174 business+1 API+4 harness=179 tests/21 suites;no fully verified route or E2E"
    api_boundary_controls_count: 1
    harness_controls_count: 4
    web_tests_count: 179
    business_view_command: "docker compose -f docker-compose.dev.yml exec -T web pnpm run test --runInBand --detectOpenHandles"
    browser_e2e_available: false
    browser_e2e_tool: "not configured; backend e2e is not browser coverage"
    coverage_command: "docker compose -f docker-compose.dev.yml exec -T web pnpm run test:coverage --runInBand"
    coverage_report_verified: true
    coverage_report_scope: "Targeted file reports verified through E047; not full-application or route coverage"
  coverage:
    available: true
    command: "jest --coverage"
  quality:
    linter: "eslint"
    type_checker: "tsc --noEmit"
    formatter: "prettier"
