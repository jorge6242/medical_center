name: centro_medico

services:
  db:
    image: postgres:16-alpine
    container_name: centro_medico_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: centro_medico
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d centro_medico"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: centro_medico_api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/centro_medico?schema=public
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: centro_medico_web
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      api:
        condition: service_started
    networks:
      - frontend-net

  nginx:
    image: nginx:alpine
    container_name: centro_medico_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    networks:
      - frontend-net

networks:
  backend-net:
  frontend-net:

volumes:
  postgres_data:
